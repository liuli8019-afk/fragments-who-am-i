<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Who am I?</title>
<style>
:root{
  --paper:#FFFFFF; --mist:#FAF8F5; --line:#E9E5DE; --ink:#17161A;
  --graphite:#6E6A66; --dust:#B4AEA4; --sage:#7C8F73; --indigo:#35415E; --coral:#B4544A;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","Songti TC",Georgia,"Times New Roman",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  transition:background .3s ease,color .3s ease}
body.dark{background:var(--ink);color:var(--paper)}
.wrap{max-width:672px;margin:0 auto;padding:40px 24px 80px}
@media(min-width:640px){.wrap{padding:56px 32px 80px}}

.topbar{display:flex;justify-content:flex-end;margin-bottom:16px}
.lang{background:none;border:0;cursor:pointer;font-size:11px;letter-spacing:.18em;color:var(--dust);padding:4px 8px;font-family:var(--sans)}
body.dark .lang{color:rgba(255,255,255,.45)}

h1{font-family:var(--serif);font-size:26px;line-height:1.25;letter-spacing:.06em;margin:0;cursor:default;user-select:none}
@media(min-width:640px){h1{font-size:30px}}
.sub{margin:8px 0 0;font-size:13px;line-height:1.7;color:var(--graphite)}

.replybox{margin-bottom:32px}
.reply{border-left:2px solid var(--sage);padding:4px 0 4px 16px}
.reply.crisis{border-left-color:var(--indigo)}
.reply p{font-family:var(--serif);font-size:15px;line-height:1.9;margin:0}
.reply .note{margin-top:12px;font-size:12px;line-height:1.7;color:var(--graphite);font-family:var(--sans)}
.card{margin-top:24px;background:var(--mist);border-radius:12px;padding:20px}
.card .meta{font-size:10.5px;letter-spacing:.2em;color:var(--dust);margin-bottom:16px}
.card .lab{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.2em;color:var(--graphite);margin-bottom:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--sage)}
.dot.deep{background:var(--indigo)}
.chips{display:flex;flex-wrap:wrap;gap:6px 16px}
.chips span{font-family:var(--serif)}
.chips.s span{font-size:16px}
.chips.d span{font-size:13.5px}
.card .div{border-top:1px solid var(--line);margin-top:20px;padding-top:20px}
.card .foot{margin-top:20px;font-size:11px;color:var(--dust)}

.inputbox{border:1px solid var(--line);border-radius:16px;background:var(--mist)}
textarea{width:100%;resize:none;background:transparent;border:0;outline:none;padding:20px 20px 8px;
  font-family:var(--serif);font-size:15px;line-height:1.9;color:var(--ink);min-height:96px;max-height:220px}
textarea::placeholder{color:var(--dust)}
.inputfoot{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 16px}
.circ{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:var(--paper);color:var(--graphite);cursor:pointer;transition:opacity .2s}
.circ.on{border-color:var(--sage);color:var(--sage)}
.circ.send{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.circ:disabled{opacity:.25;cursor:default}
.right{display:flex;align-items:center;gap:12px}
.hint{font-size:11px;color:var(--sage)}
.err{margin-top:12px;font-size:12px;color:var(--coral)}

.gates{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:32px}
.gate{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:20px;cursor:pointer;
  font-family:var(--serif);font-size:17px;letter-spacing:.05em;color:var(--ink);transition:opacity .2s}
.gate:hover{opacity:.8}
.gate.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.tail{margin-top:40px;display:flex;align-items:center;justify-content:space-between}
.tail .count{font-size:11px;color:var(--dust);background:none;border:0;padding:0;cursor:pointer;
  text-decoration:underline;text-underline-offset:4px;font-family:var(--sans)}
.tail .count.plain{cursor:default;text-decoration:none}
.tail .clear{font-size:11px;color:var(--dust);background:none;border:0;cursor:pointer;font-family:var(--sans)}

.back{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--graphite);background:none;border:0;
  cursor:pointer;margin-bottom:32px;padding:0;font-family:var(--sans)}
body.dark .back{color:rgba(255,255,255,.55)}
.empty{font-size:13px;line-height:1.7;color:var(--graphite)}
body.dark .empty{color:rgba(255,255,255,.55)}

.cloud{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:16px 24px;padding:32px 0;user-select:none}
.cloud span{font-family:var(--serif);line-height:1.3;cursor:pointer;opacity:var(--o);transition:opacity .2s ease}
.cloud:hover span{opacity:.13}
.cloud span:hover{opacity:1}
body.dark .cloud span{color:var(--paper)}
#tip{position:fixed;pointer-events:none;font-size:11px;letter-spacing:.02em;color:var(--graphite);z-index:60;display:none}
body.dark #tip{color:rgba(255,255,255,.7)}

.reveal{margin-top:32px;padding-top:24px;border-top:1px solid rgba(255,255,255,.16)}
.reveal .lab{font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.45);margin-bottom:12px}
.reveal .row{display:flex;flex-wrap:wrap;gap:10px 20px}
.reveal .row span{font-family:var(--serif);font-size:13.5px}

.mlist{display:flex;flex-direction:column}
.mrow{text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;cursor:pointer;
  font-family:var(--sans);transition:opacity .2s}
.mrow:hover{opacity:.6}
body.dark .mrow{border-bottom-color:rgba(255,255,255,.12)}
.mrow .d{font-size:12px;letter-spacing:.02em;color:var(--ink)}
body.dark .mrow .d{color:var(--paper)}
.mrow .t{margin-left:12px;font-size:11px;color:var(--dust)}
body.dark .mrow .t{color:rgba(255,255,255,.4)}

.detail .stamp{font-size:11px;letter-spacing:.18em;color:var(--dust);margin-bottom:20px}
body.dark .detail .stamp{color:rgba(255,255,255,.35)}
.detail .text{font-family:var(--serif);font-size:15px;line-height:2;margin:0}
.detail .meta{margin-top:20px;font-size:11.5px;color:var(--graphite)}
body.dark .detail .meta{color:rgba(255,255,255,.5)}
.detail .sec{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
body.dark .detail .sec{border-top-color:rgba(255,255,255,.12)}
.detail .sec .lab{font-size:10px;letter-spacing:.2em;color:var(--dust);margin-bottom:10px}

.field{margin-bottom:16px}
.field label{display:block;font-size:11.5px;color:var(--graphite);margin-bottom:6px}
.input{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:10px 12px;
  font-size:13px;font-family:var(--sans);color:var(--ink);outline:none}
.input:focus{border-color:var(--graphite)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.g2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 16px;font-size:12.5px;
  cursor:pointer;font-family:var(--sans);color:var(--ink)}
.btn:hover{background:var(--mist)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--coral)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sechead{font-size:10px;letter-spacing:.24em;color:var(--dust);margin:36px 0 14px}
.sechead:first-of-type{margin-top:8px}
.tipline{font-size:11.5px;line-height:1.8;color:var(--graphite);margin:-4px 0 14px}
.tipline.warn{color:var(--coral)}
.rules{font-size:12px;line-height:2;color:var(--graphite);padding-left:18px;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:12px;color:var(--graphite);margin:0}
.kv dt{color:var(--dust)}

.veil{position:fixed;inset:0;background:rgba(23,22,26,.55);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:24px}
.veil .box{max-width:420px;width:100%;max-height:86vh;overflow-y:auto;background:var(--paper);border-radius:16px;
  padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.veil .box h2{font-family:var(--serif);font-size:18px;letter-spacing:.03em;margin:0 0 14px;color:var(--ink)}
.veil .box p{font-size:12.5px;line-height:1.8;color:var(--graphite);margin:0 0 12px}
.veil .veilsep{border-top:1px solid var(--line);margin:8px 0 20px}
.veil .box button{width:100%;margin-top:6px;background:var(--ink);color:var(--paper);border:0;border-radius:8px;
  padding:10px;font-size:13px;line-height:1.6;cursor:pointer;font-family:var(--sans)}

.deepfoot{margin-top:24px;font-size:11px;line-height:1.7;color:var(--dust);text-align:center;max-width:420px;
  margin-left:auto;margin-right:auto}
body.dark .deepfoot{color:rgba(255,255,255,.4)}
</style>

};

    yes:'这个服务允许浏览器直接调用,填好 Key 就能用。',
    maybe:'不一定允许浏览器直接调用。如果失败,填下面的跨域中转。',

const DEFAULTS = {
  entries: [], surface: [], deep: [], domains: [], lang: 'en', seenIntro: false,
  settings: {provider:'anthropic', protocol:'anthropic', apiKey:'',
    baseUrl:'https://api.anthropic.com/v1', model:'claude-sonnet-4-5', temperature:0.2, proxy:''}
};

let D = load();
/* 导航栈:栈底永远是 home,每一帧带着自己的筛选条件和主题,
   退回上一层时这些附属状态跟着一起恢复。 */
let stack = [{view:'home', filter:null, id:null, dark:false}];
const frame = () => stack[stack.length - 1];   // 不要叫 top:window.top 是只读全局,顶层同名声明会让整段脚本报语法错
function push(frame){ stack = stack.concat([Object.assign({view:'home', filter:null, id:null, dark:false}, frame)]); revealed = false; err = ''; render(); }
function pop(){ if(stack.length > 1) stack = stack.slice(0, -1); revealed = false; render(); }
let busy = false, reply = null, err = '', listening = false, confirmReset = false, revealed = false;
let rec = null;

function load(){
  try{
    let raw = localStorage.getItem(STORE);
    if(!raw) raw = migrate();                    // 从 React 版的存储键接管旧档案
    if(!raw) return JSON.parse(JSON.stringify(DEFAULTS));
    const d = JSON.parse(raw);
    const base = JSON.parse(JSON.stringify(DEFAULTS));
    const merged = Object.assign(base, d);
    merged.settings = Object.assign(base.settings, d.settings || {});
    return merged;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULTS)); }
}
/* React 版用的是 self-archaeology-v1 / self-archaeology-lang 两个键。
   如果这台浏览器上有旧档案而新键还是空的,一次性接管过来,旧键原样保留不删。 */
function migrate(){
  try{
    const old = localStorage.getItem('self-archaeology-v1');
    if(!old) return null;
    const d = JSON.parse(old);
    const lang = localStorage.getItem('self-archaeology-lang');
    const base = JSON.parse(JSON.stringify(DEFAULTS));
    const merged = Object.assign(base, {
      entries: d.entries || [], surface: d.surface || [],
      deep: d.deep || [], domains: d.domains || []
    });
    if(lang === 'zh' || lang === 'en') merged.lang = lang;
    const s = JSON.stringify(merged);
    localStorage.setItem(STORE, s);
    return s;
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(D)); }catch(e){ err = t().errSave; } }

const INGEST_PROMPT = (text, digest, lang) => `你是一个长期陪伴用户做自我考古的分析引擎。用户零散地说出记忆、人生事件、突然想起的片段。你要把每个片段整理成结构化记录,并更新他的身份地图。

用户已有的档案:
${digest}

用户这次输入:
"""
${text}
"""

请只输出一个 JSON 对象,不要有任何前后文字、不要用 markdown 代码块。结构:
{
  "reply": "60-110字(英文时 60-100 words)的分析。用第二人称,直接说出:当时的他在那件事里处于什么状态、表现出什么特性、这些特性是怎么被情境逼出来的、现在还在怎么运作。落到他说的细节上,不回避不好听的部分。",
  "event": {
    "title": "6字以内的事件名",
    "time": "如'童年''高中''去年''不详'",
    "ageStage": "幼年/童年/青春期/成年早期/成年/不详",
    "people": ["涉及的人物关系"],
    "content": "一句话事实描述",
    "emotion": ["情绪词 2-4 个"],
    "behavior": "他当时的行为反应,一句话"
  },
  "surface": [
    {"keyword": "中文日常词", "en": "对应的英文日常词", "evidence": "这个词从这段话的哪里来,一句话"}
  ],
  "deep": [
    {"term": "English psychological construct", "zh": "中文译名", "evidence": "依据,一句话", "strength": 70}
  ],
  "domains": [
    {"name": "受控词表里的中文方向名", "strength": 60}
  ],
  "safety": "none"
}

输出语言:reply、event 各字段、evidence 一律使用${
  lang === "en" ? "英文" : "中文"
}。但下面这几个字段的语言是固定的,不跟界面语言走,也绝对不要对调:surface 的 keyword 必须是中文(它是跨语言的合并键)、en 必须是英文;deep 的 term 必须是英文、zh 必须是中文译名;domains 的 name 必须是中文原词。

规则:
- reply 里绝对不要出现任何问句,不要反问,不要以问题结尾,不要邀请他多讲。他只想直接拿到分析结果。信息不足就基于现有内容做出有限但明确的判断。
- surface 描述的是他在这件事发生的当下所呈现出来的特性,是对故事里那个人的客观描述,不是对他整个人的评价。以事件中实际发生的行为为准:他做了什么、没做什么、怎么反应。
- 难看的特性如实给出:懦弱、退缩、讨好、隐忍、麻木、不敢开口、认命、逞强、自我怀疑。不要因为怕伤人就回避,也不要把一段被欺负、被压制的经历里的沉默说成"坚强"。
- 好的特性同样如实给出:撑住了、护住了别人、忍着把事做完、没有还手但也没有认同、给自己留了退路、察觉到了不对劲、事后自己消化掉了、还愿意靠近人。
- 哪一面在故事里更明显,就让哪一面更多。两边都不要替他修饰,也都不要替他加码。
- 特性必须属于故事里那个人在事件发生当时。禁止从叙述行为本身提取特性——记得清楚、表达清晰、愿意讲出来、记忆完整、条理分明、观察力敏锐,这些是今天在讲述的人的属性,不是当年在场的人的属性,一律不要。
- surface 最多给 10 个,至少 3 个,按与这段叙述的相关度从高到低排列。有多少给多少,凑不满就少给。必须是普通人一看就懂的日常词,禁止任何专业术语。已有的词再次出现时,keyword 用完全相同的字符串。
- 想多给几个的办法是把这段叙述看得更细:他当时的姿态、说话方式、对他人的反应、对自己的反应、事后的处理方式,都可以各出一个词。但每一个词都必须能在他说的话里指出依据。严禁为了凑数编造叙述里没有的内容,也严禁在没词可给时转而去描述他的叙述行为。宁可只给 3 个。
- deep 给 1-4 个,使用人格心理学、依恋理论、创伤心理学、认知行为理论、精神分析、神经科学中的描述性构念,例如:Attachment Anxiety、Hypervigilance、Emotional Suppression、Maladaptive Perfectionism、Avoidant Coping、Negative Self-Schema、Conditional Self-Worth、Fear of Failure Schema、Emotional Invalidation、Parentification、Learned Helplessness、Shame-Based Identity、Identification with the Aggressor、Dissociative Detachment、Reaction Formation、Repression、Displacement、Splitting、Intellectualization、Somatization、Freeze Response。已有的构念再次出现时,term 用完全相同的英文字符串。
- strength 是 0-100 的整数,表示这一段材料对该项的支持强度:证据直接明确给 75-95,间接推断给 40-70,只是苗头给 20-40。
- domains 是"值得关注的方向",给 0-3 个,只能从下面这个固定词表里原样选取,不得自创、不得改写:创伤后应激方向、抑郁情绪方向、焦虑与过度警觉方向、社交回避方向、强迫倾向方向、解离方向、情绪调节困难方向、依恋不安全方向、羞耻与自我否定方向、躯体化与睡眠方向、人际信任受损方向、注意力困难方向。材料里没有依据的方向就不要给,宁可少给。
- 绝对禁止输出任何疾病名称、诊断标签、DSM-5 或 ICD-11 分类名,以及"确诊""疑似""符合……标准"这类措辞。你做的是模式描述,不是诊断。
- 如果输入里出现自伤、自杀、想消失或严重危机的信号,把 safety 设为 "crisis",surface、deep、domains 都返回空数组,reply 改为温柔地关心他此刻的状态、并邀请他联系身边可信任的人或专业支持。
- 如果只是很痛苦但没有危机信号,safety 设为 "distress",其余照常。
- 如果输入完全不是关于个人经历,reply 正常回应,event 各字段留空,surface、deep、domains 返回空数组。`;

第一组是中文日常人格词,需要英文对应词。要求:普通人一看就懂的日常英文,不要用临床术语,不要解释,一个词或一个短语。
${JSON.stringify(surfaceWords)}

第二组是英文心理学构念名,需要中文译名。要求:使用心理学中文文献里的通行译法,不要音译,不要加括号注释。
${JSON.stringify(deepTerms)}

请只输出一个 JSON 对象,不要有任何前后文字、不要用 markdown 代码块:
{
  "surface": {"中文词": "English word"},
  "deep": {"English Construct": "中文译名"}
}
两组都必须原样使用给定的字符串作为键,一个不漏,不要新增。`;

/* ------------------------- 接口调用 ------------------------- */
function keyRequired(){ return !/localhost|127\.0\.0\.1|0\.0\.0\.0/.test(D.settings.baseUrl || ''); }
function applyProxy(url){
  const px = (D.settings.proxy || '').trim();
  if(!px) return url;
  return px.includes('{url}') ? px.replace('{url}', encodeURIComponent(url)) : px.replace(/\/+$/,'') + '/' + url;
}
function configured(){
  const s = D.settings;
  return !!(s.baseUrl && s.model && (s.apiKey || !keyRequired()));
}

async function askAI(prompt, retry){
  const s = D.settings, proto = s.protocol || 'openai';
  const base = (s.baseUrl || '').replace(/\/+$/,'');
  if(!s.apiKey && keyRequired()) throw new Error(t().errNoKey);
  if(!base) throw new Error(t().errNoBase);
  if(!s.model) throw new Error(t().errNoModel);
  const temp = +s.temperature || 0.2;
  let url, headers, body;

  if(proto === 'anthropic'){
    url = base + '/messages';
    headers = {'Content-Type':'application/json','x-api-key':s.apiKey,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
    body = {model:s.model, max_tokens:1500, temperature:temp, messages:[{role:'user', content:prompt}]};
  } else if(proto === 'gemini'){
    url = base + '/models/' + encodeURIComponent(s.model) + ':generateContent?key=' + encodeURIComponent(s.apiKey);
    headers = {'Content-Type':'application/json'};
    body = {contents:[{role:'user', parts:[{text:prompt}]}],
      generationConfig:{temperature:temp, responseMimeType:'application/json'}};
  } else {
    url = base + '/chat/completions';
    headers = {'Content-Type':'application/json'};
    if(s.apiKey) headers['Authorization'] = 'Bearer ' + s.apiKey;
    body = {model:s.model, temperature:temp, messages:[{role:'user', content:prompt}]};
    if(!retry) body.response_format = {type:'json_object'};
  }

  let r;
  try{
    r = await fetch(applyProxy(url), {method:'POST', headers, body:JSON.stringify(body)});
  }catch(e){
    throw new Error(t().errNetwork(e.message));
  }
  if(!r.ok){
    const txt = await r.text();
    if(proto === 'openai' && !retry && (r.status === 400 || r.status === 422)) return askAI(prompt, true);
    let msg = txt;
    try{ const j = JSON.parse(txt); msg = (j.error && (j.error.message || j.error.type)) || j.message || txt; }catch(e){}
    throw new Error(t().errUpstream(r.status, String(msg).slice(0, 200)));
  }
  const j = await r.json();
  if(proto === 'anthropic') return (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  if(proto === 'gemini'){
    const c = (j.candidates || [])[0];
    return c ? ((c.content && c.content.parts || []).map(x => x.text || '').join('')) : '';
  }
  const m = j.choices && j.choices[0] && j.choices[0].message;
  return (m && (typeof m.content === 'string' ? m.content : (m.content || []).map(x => x.text || '').join(''))) || '';
}

function parseJSON(raw){
  let x = String(raw).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a = x.indexOf('{'), b = x.lastIndexOf('}');
  if(a < 0 || b < 0) throw new Error('parse');
  return JSON.parse(x.slice(a, b + 1));
}

function profileDigest(p){
  const surface = p.surface.slice(0,12).map(k => `${k.keyword}(${k.weight})`).join('、');
  const deep = p.deep.slice(0,12).map(d => `${d.term}(${d.weight})`).join('、');
  const recent = p.entries.slice(-4).map(en => `- ${en.text.slice(0,60)}`).join('\n');
  return `已有表层关键词:${surface || '无'}\n已有深层构念:${deep || '无'}\n最近的记忆:\n${recent || '无'}`;
}

/* ------------------------- 字段语言归一 -------------------------
   浅层词固定为 keyword=中文 / en=英文,深层构念固定为 term=英文 / zh=中文。
   模型偶尔会把两个字段整个对调,导致中文界面显示英文、英文界面显示中文。
   这里在落库前纠正,并对已经存歪的老数据做一次性迁移。 */
const hasCJK = x => /[\u4e00-\u9fff]/.test(String(x || ''));

function fixSurfaceWord(w){
  if(!w) return w;
  if(w.keyword && w.en && !hasCJK(w.keyword) && hasCJK(w.en)){
    const k = w.keyword; w.keyword = w.en; w.en = k;
  }
  return w;
}
function fixDeepTerm(d){
  if(!d) return d;
  if(d.term && d.zh && hasCJK(d.term) && !hasCJK(d.zh)){
    const x = d.term; d.term = d.zh; d.zh = x;
  }
  return d;
}
function migrateLangFields(){
  if(D.langFixedAt) return;
  D.surface.forEach(fixSurfaceWord);
  D.deep.forEach(fixDeepTerm);
  D.langFixedAt = Date.now();
  save();
}

/* ------------------------- 合并逻辑 ------------------------- */
function scoreOf(sum, weight){
  const avg = (sum || 50) / weight;
  return Math.min(100, Math.round(avg * (1 + 0.16 * (weight - 1))));
}
const uniqIds = src => Array.from(new Set((src || []).map(x => x.entryId)));

function mergeProfile(entryId, r){
  (r.surface || []).forEach(s => {
    if(!s || !s.keyword) return;
    fixSurfaceWord(s);
    const key = String(s.keyword).trim();
    const hit = D.surface.find(k => k.keyword === key);
    if(hit){
      hit.weight += 1;
      if(s.en && !hit.en) hit.en = s.en;
      hit.sources.push({entryId, evidence:s.evidence || ''});
    } else {
      D.surface.push({keyword:key, en:s.en || key, weight:1, sources:[{entryId, evidence:s.evidence || ''}]});
    }
  });

  (r.deep || []).forEach(s => {
    if(!s || !s.term) return;
    fixDeepTerm(s);
    const term = String(s.term).trim();
    const st = Math.max(0, Math.min(100, Number(s.strength) || 50));
    const hit = D.deep.find(d => d.term === term);
    if(hit){
      hit.weight += 1; hit.strengthSum = (hit.strengthSum || 50) + st;
      if(s.zh && !hit.zh) hit.zh = s.zh;
      hit.sources.push({entryId, evidence:s.evidence || ''});
    } else {
      D.deep.push({term, zh:s.zh || '', weight:1, strengthSum:st, sources:[{entryId, evidence:s.evidence || ''}]});
    }
  });
  D.deep.forEach(d => d.score = scoreOf(d.strengthSum, d.weight));

  (r.domains || []).forEach(s => {
    if(!s || !s.name) return;
    const name = String(s.name).trim();
    if(!DOMAINS[name]) return;              // 只接受词表内的项
    const st = Math.max(0, Math.min(100, Number(s.strength) || 50));
    const hit = D.domains.find(d => d.name === name);
    if(hit){ hit.weight += 1; hit.strengthSum = (hit.strengthSum || 50) + st; }
    else { D.domains.push({name, weight:1, strengthSum:st}); }
  });
  D.domains.forEach(d => d.score = scoreOf(d.strengthSum, d.weight));

  D.surface.sort((a, b) => b.weight - a.weight);
  D.deep.sort((a, b) => (b.score || 0) - (a.score || 0));
  D.domains.sort((a, b) => (b.score || 0) - (a.score || 0));
}

/* 补齐词云的另一种语言,每个词只翻译一次 */
let translating = false;
async function ensureTranslations(){
  if(translating || !configured()) return;
  const needEn = D.surface.filter(w => !w.en || w.en === w.keyword).map(w => w.keyword);
  const needZh = D.deep.filter(d => !d.zh).map(d => d.term);
  if(!needEn.length && !needZh.length) return;
  translating = true;
  try{
    const r = parseJSON(await askAI(TRANSLATE_PROMPT(needEn, needZh)));
    D.surface.forEach(w => { if(r.surface && r.surface[w.keyword]) w.en = r.surface[w.keyword]; });
    D.deep.forEach(d => { if(r.deep && r.deep[d.term]) d.zh = r.deep[d.term]; });
    save(); render();
  }catch(e){ /* 翻译失败就先用原语言显示,下次再试 */ }
  translating = false;
}

async function submit(){
  const el = document.getElementById('inp');
  const v = (el ? el.value : '').trim();
  if(!v || busy) return;
  if(!configured()){ err = t().noConfig; render(); return; }
  busy = true; err = ''; reply = null; stopMic(); render();
  try{
    const r = parseJSON(await askAI(INGEST_PROMPT(v, profileDigest(D), D.lang)));
    const entry = {id:'e' + Date.now(), text:v, at:Date.now(), event:r.event || null, safety:r.safety || 'none'};
    D.entries.push(entry);
    mergeProfile(entry.id, r);
    save();
    reply = {
      text: r.reply || '', safety: r.safety || 'none',
      surface: (r.surface || []).map(x => D.lang === 'en' ? (x.en || x.keyword) : x.keyword).filter(Boolean),
      deep: (r.deep || []).map(x => D.lang === 'en' ? x.term : (x.zh || x.term)).filter(Boolean),
      event: r.event || null
    };
  }catch(e){
    // 接口层的报错(缺 Key、跨域、上游状态码)原样透出,解析失败才用通用文案
    err = /API key|Base URL|Model name|Endpoint returned|never left the browser|Key|接口|请求没有发出去|接口返回/.test(e.message)
      ? e.message : t().errAnalyze;
  }
  busy = false; render();
}

      <p>${esc(reply.text)}</p>
      ${reply.safety === 'crisis' ? `<p class="note">${esc(T_.crisis)}</p>` : ''}</div>`;
    if(reply.surface.length || reply.deep.length){
      const ev = reply.event ? [reply.event.time, reply.event.ageStage, reply.event.title].filter(Boolean).join(' · ') : '';
      h += `<div class="card">${ev ? `<div class="meta">${esc(ev)}</div>` : ''}
        ${reply.surface.length ? `<div><div class="lab"><span class="dot"></span>${esc(T_.surfaceLabel)}</div>
          <div class="chips s">${reply.surface.map(k => `<span>${esc(k)}</span>`).join('')}</div></div>` : ''}
        ${reply.deep.length ? `<div class="${reply.surface.length ? 'div' : ''}"><div class="lab"><span class="dot deep"></span>${esc(T_.deepLabel)}</div>
          <div class="chips d">${reply.deep.map(k => `<span>${esc(k)}</span>`).join('')}</div></div>` : ''}
        <div class="foot">${esc(T_.merged)}</div></div>`;
    }
    h += `</div>`;
  } else { h += `<div style="height:32px"></div>`; }

  h += `<div class="inputbox">
      <textarea id="inp" rows="3" placeholder="${esc(T_.placeholder)}"></textarea>
      <div class="inputfoot">
        <button class="circ${listening ? ' on' : ''}" data-act="mic">${listening ? ICON.stop : ICON.mic}</button>
        <div class="right">${listening ? `<span class="hint">${esc(T_.listening)}</span>` : ''}
          <button class="circ send" data-act="send" ${busy ? 'disabled' : ''}>${busy ? ICON.spin : ICON.up}</button></div>
      </div></div>
    ${err ? `<p class="err">${esc(err)}</p>` : ''}
    <div class="gates">
      <button class="gate" data-act="go" data-v="surface">${esc(T_.me1)}</button>
      <button class="gate dark" data-act="go" data-v="deep">${esc(T_.me2)}</button>
    </div>
    <div class="tail">
      ${n === 0 ? `<span class="count plain">${esc(T_.countZero)}</span>`
                : `<button class="count" data-act="list">${esc(T_.count(n))}</button>`}
      ${n === 0 ? '' : (confirmReset
        ? `<span style="font-size:11px;color:var(--graphite)">${esc(T_.clearWarn)}
           <button class="clear" data-act="wipe" style="color:var(--coral);text-decoration:underline;margin-left:8px">${esc(T_.clearYes)}</button>
           <button class="clear" data-act="nowipe" style="text-decoration:underline;margin-left:12px">${esc(T_.clearNo)}</button></span>`
        : `<button class="clear" data-act="askwipe">${esc(T_.clear)}</button>`)}
    </div>`;
  return h;
}

/* ------- 词云 ------- */
function cloud(items){
  const max = Math.max(1, ...items.map(i => i.weight));
  return `<div class="cloud" id="cloud">${items.map(it => {
    const r = it.weight / max;
    return `<span data-k="${esc(it.key)}" data-n="${it.count}"
      style="font-size:${16 + Math.round(r * 25)}px;--o:${(0.42 + r * 0.58).toFixed(2)}">${esc(it.label)}</span>`;
  }).join('')}</div>`;
}

function surfaceItems(){
  return D.surface.map(w => {
    const ids = uniqIds(w.sources);
    return {key:w.keyword, label:D.lang === 'en' ? (w.en || w.keyword) : w.keyword, weight:w.weight, count:ids.length, ids};
  });
}
function deepItems(){
  return D.deep.map(d => {
    const ids = uniqIds(d.sources);
    return {key:d.term, label:D.lang === 'en' ? d.term : (d.zh || d.term), weight:d.weight, count:ids.length, ids};
  });
}

function vSurface(){
  const items = surfaceItems();
  return backBtn() + (items.length ? cloud(items) : `<p class="empty">${esc(t().empty)}</p>`);
}

/* ------- 我2:彩蛋 -------
   方向那一排默认不出现。条件一,记忆数量达到 REVEAL_AFTER;
   条件二,在词云上按住不放约 HOLD_MS。两个都满足才浮出来,离开页面即收回。 */
const REVEAL_AFTER = 8, HOLD_MS = 1200;

function vDeep(){
  const items = deepItems();
  if(!items.length) return backBtn() + `<p class="empty">${esc(t().empty)}</p>`;
  const doms = D.domains.slice().sort((a, b) => (b.score || 0) - (a.score || 0));
  const unlocked = D.entries.length >= REVEAL_AFTER && doms.length > 0;
  const shade = (i, n) => {
    const p = n <= 1 ? 0 : i / (n - 1), from = [255,255,255], to = [104,110,124];
    return 'rgb(' + from.map((v, k) => Math.round(v + (to[k] - v) * p)).join(',') + ')';
  };
  return backBtn() + cloud(items) + ((unlocked && revealed)
    ? `<div class="reveal"><div class="lab">${esc(t().notDiagnosis)}</div><div class="row">${
        doms.map((d, i) => `<span style="color:${shade(i, doms.length)}">${esc(D.lang === 'en' ? (DOMAINS[d.name] || d.name) : d.name)}</span>`).join('')
      }</div></div>` : '') + `<p class="deepfoot">${esc(t().deepFooter)}</p>`;
}

/* ------- 记忆清单 / 详情 ------- */
function vMemories(){
  const filter = frame().filter;
  const list = (filter ? D.entries.filter(e => filter.ids.includes(e.id)) : D.entries).slice().reverse();
  return backBtn() + `<div class="mlist">${list.map(e =>
    `<button class="mrow" data-act="open" data-id="${e.id}">
      <span class="d">${esc(fmtDate(e.at))}</span><span class="t">${esc(fmtTime(e.at))}</span></button>`).join('')}</div>`;
}

function vMemory(){
  const e = D.entries.find(x => x.id === frame().id);
  if(!e) return backBtn();
  const sw = D.surface.filter(w => uniqIds(w.sources).includes(e.id)).map(w => D.lang === 'en' ? (w.en || w.keyword) : w.keyword);
  const dw = D.deep.filter(d => uniqIds(d.sources).includes(e.id)).map(d => D.lang === 'en' ? d.term : (d.zh || d.term));
  const meta = e.event ? [e.event.time, e.event.ageStage].concat(e.event.people || []).filter(Boolean).join(' · ') : '';
  return backBtn() + `<div class="detail">
    <div class="stamp">${esc(fmtDate(e.at))} · ${esc(fmtTime(e.at))}</div>
    <p class="text">${esc(e.text)}</p>
    ${meta ? `<div class="meta">${esc(meta)}</div>` : ''}
    ${sw.length ? `<div class="sec"><div class="lab">${esc(t().surfaceLabel)}</div>
      <div class="chips s">${sw.map(k => `<span>${esc(k)}</span>`).join('')}</div></div>` : ''}
    ${dw.length ? `<div class="sec"><div class="lab">${esc(t().deepLabel)}</div>
      <div class="chips d">${dw.map(k => `<span>${esc(k)}</span>`).join('')}</div></div>` : ''}
  </div>`;
}

/* ------- 隐藏的设置页 ------- */
function vSettings(){
  const s = D.settings, T_ = t();
  const p = PROVIDERS.find(x => x.id === s.provider) || {};
  const note = (CORS_NOTE[D.lang] || CORS_NOTE.zh)[p.cors] || '';
  const protoNames = PROTO_NAME[D.lang] || PROTO_NAME.zh;
  return backBtn() + `
    <div class="sechead">${esc(T_.setConn)}</div>
    <p class="tipline">${esc(T_.setIntro)}</p>
    <div class="g2">
      <div class="field"><label>${esc(T_.setProvider)}</label>
        <select class="input" id="sProvider">${PROVIDERS.map(x =>
          `<option value="${x.id}" ${s.provider === x.id ? 'selected' : ''}>${esc(D.lang === 'en' ? (x.nameEn || x.name) : x.name)}</option>`).join('')}</select></div>
      <div class="field"><label>${esc(T_.setProto)}</label>
        <select class="input" id="sProto">${Object.entries(protoNames).map(([k, v]) =>
          `<option value="${k}" ${(s.protocol || 'openai') === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
    </div>
    <p class="tipline${p.cors === 'no' ? ' warn' : ''}">${esc(note)}</p>
    <div class="field"><label>${esc(T_.setBase)}</label>
      <input class="input" id="sBase" placeholder="https://your-endpoint/v1" value="${esc(s.baseUrl)}"></div>
    <div class="g2">
      <div class="field"><label>${esc(T_.setModel)}</label>
        <input class="input" id="sModel" value="${esc(s.model)}"></div>
      <div class="field"><label>${esc(T_.setTemp)}</label>
        <input class="input" id="sTemp" type="number" step="0.1" min="0" max="1" value="${esc(s.temperature)}"></div>
    </div>
    <div class="field"><label>${esc(T_.setProxy)}</label>
      <input class="input" id="sProxy" placeholder="${esc(t().proxyPh)}" value="${esc(s.proxy || '')}"></div>
    <div class="field"><label>${esc(keyRequired() ? T_.setKey : T_.setKeyOpt)}</label>
      <input class="input" id="sKey" type="password" autocomplete="off" value="${esc(s.apiKey)}"></div>
    <div class="row">
      <button class="btn primary" data-act="saveset">${esc(T_.setSave)}</button>
      <button class="btn" data-act="test">${esc(T_.setTest)}</button>
      <span class="tipline" id="testOut" style="margin:0"></span>
    </div>

    <div class="sechead">${esc(T_.setData)}</div>
    <dl class="kv"><dt>·</dt><dd>${esc(T_.stat(D))}</dd></dl>
    <div class="row" style="margin-top:14px">
      <button class="btn" data-act="export">${esc(T_.setExport)}</button>
      <button class="btn" data-act="import">${esc(T_.setImport)}</button>
      <button class="btn danger" data-act="wipeall">${esc(T_.setWipe)}</button>
    </div>

    <div class="sechead">${esc(T_.setRules)}</div>
    <ul class="rules">${T_.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul>`;
}

/* ------------------------- 交互 ------------------------- */
let holdTimer = null, holdFired = false, titleTimer = null;

function stopMic(){ if(rec){ try{ rec.stop(); }catch(e){} } listening = false; }

function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ err = t().micOff; render(); return; }
  if(listening){ stopMic(); render(); return; }
  try{
    rec = new SR();
    rec.lang = t().speech; rec.continuous = true; rec.interimResults = false;
    rec.onresult = ev => {
      let add = '';
      for(let i = ev.resultIndex; i < ev.results.length; i++) if(ev.results[i].isFinal) add += ev.results[i][0].transcript;
      const el = document.getElementById('inp');
      if(add && el){ el.value += add; el.dispatchEvent(new Event('input')); }
    };
    rec.onerror = () => { listening = false; err = t().micFail; render(); };
    rec.onend = () => { listening = false; const b = document.querySelector('[data-act="mic"]'); if(b) b.classList.remove('on'); };
    rec.start(); listening = true; render();
  }catch(e){ err = t().micOff; render(); }
}

function openList(filter, isDark){ push({view:'memories', filter, dark:!!isDark}); }

function readSettings(){
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  D.settings.provider = g('sProvider');
  D.settings.protocol = g('sProto');
  D.settings.baseUrl  = g('sBase');
  D.settings.model    = g('sModel');
  D.settings.temperature = Math.max(0, Math.min(1, parseFloat(g('sTemp')) || 0.2));
  D.settings.proxy    = g('sProxy');
  D.settings.apiKey   = g('sKey');
}

function bind(){
  const app = document.getElementById('app');

  app.onclick = async ev => {
    const el = ev.target.closest('[data-act]');
    if(!el) return;
    const act = el.dataset.act;

    if(act === 'lang'){ D.lang = D.lang === 'zh' ? 'en' : 'zh'; save(); render(); ensureTranslations(); }
    else if(act === 'back'){ pop(); }
    else if(act === 'go'){ push({view:el.dataset.v, dark:el.dataset.v === 'deep'}); }
    else if(act === 'send'){ submit(); }
    else if(act === 'mic'){ toggleMic(); }
    else if(act === 'list'){ openList(null, false); }
    else if(act === 'open'){ push({view:'memory', id:el.dataset.id, filter:frame().filter, dark:frame().dark}); }
    else if(act === 'askwipe'){ confirmReset = true; render(); }
    else if(act === 'nowipe'){ confirmReset = false; render(); }
    else if(act === 'wipe'){
      const keep = D.settings, lang = D.lang;
      D = JSON.parse(JSON.stringify(DEFAULTS)); D.settings = keep; D.lang = lang;
      save(); confirmReset = false; reply = null; stack = [{view:'home', filter:null, id:null, dark:false}]; render();
    }
    else if(act === 'saveset'){
      readSettings(); save();
      const o = document.getElementById('testOut'); if(o) o.textContent = t().setDone;
    }
    else if(act === 'test'){
      readSettings(); save();
      const o = document.getElementById('testOut');
      if(o) o.textContent = t().setTesting;
      try{
        await askAI('只回一个 JSON:{"ok":true}');
        if(o){ o.textContent = t().setOk; o.classList.remove('warn'); }
      }catch(e){ if(o){ o.textContent = e.message; o.classList.add('warn'); } }
    }
    else if(act === 'export'){
      const blob = new Blob([JSON.stringify(D, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'rememberme-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click(); URL.revokeObjectURL(a.href);
    }
    else if(act === 'import'){ document.getElementById('fileIn').click(); }
    else if(act === 'wipeall'){
      const keep = D.settings;
      D = JSON.parse(JSON.stringify(DEFAULTS)); D.settings = keep;
      save(); render();
    }
  };

  /* 选服务商时自动带出协议与默认地址 */
  const sp = document.getElementById('sProvider');
  if(sp){
    sp.onchange = () => {
      const x = PROVIDERS.find(v => v.id === sp.value);
      if(!x) return;
      D.settings.provider = x.id;
      D.settings.protocol = x.proto;
      if(x.base) D.settings.baseUrl = x.base;
      if(x.model) D.settings.model = x.model;
      render();
    };
  }

  /* 输入框自增高 + 快捷键 */
  const inp = document.getElementById('inp');
  if(inp){
    inp.oninput = () => { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 220) + 'px'; };
    /* 回车发送,Shift+回车换行。
       两个必须处理的情况:中文输入法组字过程中的回车是"选词",不能当发送;
       触屏软键盘的回车通常就是换行,发送只走按钮。 */
    let composing = false;
    inp.oncompositionstart = () => { composing = true; };
    inp.oncompositionend = () => { composing = false; };
    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    inp.onkeydown = e => {
      if(e.key !== 'Enter') return;
      if(e.metaKey || e.ctrlKey){ e.preventDefault(); submit(); return; }
      if(composing || e.isComposing || e.keyCode === 229) return;
      if(e.shiftKey || coarse) return;
      e.preventDefault();
      submit();
    };
  }

  /* 隐藏入口:长按标题 1.2 秒进入设置 */
  const ttl = document.getElementById('ttl');
  if(ttl){
    const start = () => { titleTimer = setTimeout(() => push({view:'settings'}), 1200); };
    const stop = () => { clearTimeout(titleTimer); titleTimer = null; };
    ttl.onpointerdown = start; ttl.onpointerup = stop; ttl.onpointerleave = stop; ttl.onpointercancel = stop;
    ttl.oncontextmenu = e => e.preventDefault();
  }

  /* 词云:悬停跟随计数 + 点击进入来源清单 + 我2 长按彩蛋 */
  const cl = document.getElementById('cloud');
  if(cl){
    const tip = document.getElementById('tip');
    cl.onpointermove = e => {
      const s = e.target.closest('span[data-k]');
      if(!s){ tip.style.display = 'none'; return; }
      tip.textContent = t().fromN(+s.dataset.n);
      tip.style.left = (e.clientX + 16) + 'px';
      tip.style.top = (e.clientY + 16) + 'px';
      tip.style.display = 'block';
    };
    cl.onpointerleave = () => { tip.style.display = 'none'; };

    cl.onclick = e => {
      const s = e.target.closest('span[data-k]');
      if(!s) return;
      if(holdFired){ holdFired = false; return; }
      const isDeep = frame().view === 'deep';
      const items = isDeep ? deepItems() : surfaceItems();
      const hit = items.find(i => i.key === s.dataset.k);
      if(hit) openList({label:hit.label, ids:hit.ids}, isDeep);
    };

    if(frame().view === 'deep'){
      const doms = D.domains.length;
      const unlocked = D.entries.length >= REVEAL_AFTER && doms > 0;
      cl.onpointerdown = () => {
        if(!unlocked || revealed) return;
        holdTimer = setTimeout(() => { holdFired = true; revealed = true; render(); }, HOLD_MS);
      };
      const cancel = () => { clearTimeout(holdTimer); holdTimer = null; };
      cl.onpointerup = cancel; cl.onpointercancel = cancel;
    }
  }
}

/* 导入 */
document.getElementById('fileIn').onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      const base = JSON.parse(JSON.stringify(DEFAULTS));
      D = Object.assign(base, d);
      D.settings = Object.assign(base.settings, d.settings || {});
      save(); stack = [{view:'home', filter:null, id:null, dark:false}]; render();
    }catch(err2){ alert(t().importFail); }
  };
  r.readAsText(f);
  e.target.value = '';
};

const style = document.createElement('style');
style.textContent = '@keyframes sp{to{transform:rotate(360deg)}}';
document.head.appendChild(style);

migrateLangFields();
render();
if(configured()) ensureTranslations();
showIntroVeil();

</script>
